<section class="contact-section" id="contact">
    <div class="contact-container">

        <div class="contact-left">
            <h2 class="contact-title" data-aos="fade-down" data-aos-easing="ease-in-elastic" data-aos-duration="1200">Contact Me</h2>
            <p class="contact-subtitle"  data-aos="fade-down" data-aos-easing="ease-in-elastic" data-aos-duration="1200">
                Feel free to contact me for job opportunities, freelance work, or collaborations.
            </p>

            <div class="contact-info" data-aos="zoom-in" data-aos-easing="ease-out-elastic" data-aos-duration="1200">

                <div class="info-box">
                    <mat-icon class="mat-icon-style"></mat-icon>
                    <div>
                        <h4>Location</h4>
                        <p>Jharkhand, India</p>
                    </div>
                </div>

                <div class="info-box">
                    <mat-icon class="mat-icon-style"></mat-icon>
                    <div>
                        <h4>Email</h4>
                        <p>dhirajkumar@gmail.com</p>
                    </div>
                </div>

                <div class="info-box">
                    <mat-icon class="mat-icon-style"></mat-icon>
                    <div>
                        <h4>Phone</h4>
                        <p>+91 8210139560</p>
                    </div>
                </div>

                <div class="info-box">
                    <mat-icon class="mat-icon-style"></mat-icon>
                    <div>
                        <h4>WhatsApp</h4>
                        <p>+91 8210139560</p>
                    </div>
                </div>

            </div>

            <div class="social-links" data-aos="fade-up" data-aos-easing="ease-out-elastic" data-aos-duration="1200">
                <a href="#" class="btn-linkedin"><i class="bi bi-linkedin"></i> LinkedIn</a>
                <a href="#" class="btn-github"><i class="bi bi-github"></i> GitHub</a>
                 <button class="back-btn" (click)="goBack()">Back</button>
            </div>
        </div>

        <!-- Right Side (Optional Contact Form) -->
        <div class="contact-right" data-aos="fade-left" data-aos-easing="ease-out-elastic" data-aos-duration="1200">
            <h3>Send Message</h3>

            <form class="contact-form">
                <input type="text" placeholder="Your Name" required />
                <input type="email" placeholder="Your Email" required />
                <textarea placeholder="Your Message" required></textarea>

                <button type="submit">Send Message</button>
            </form>
        </div>

    </div>
</section>
